name: keepick-local
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: keepick
      MYSQL_USER: keepick
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set backend/.env.local}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set backend/.env.local}
    ports: ["127.0.0.1:13306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./exec/sql/ddl.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:16379:6379"]
    volumes: ["redis-data:/data"]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  mysql-data:
  redis-data:
