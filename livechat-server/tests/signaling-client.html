<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>Keepick 1단계 소켓 점검</title>
<style>
body { font:16px system-ui; max-width:880px; margin:36px auto; padding:20px; color:#172033; background:#f6f7fb; }
section { background:white; padding:22px; border-radius:12px; margin:18px 0; }
label { display:block; margin:12px 0; } input { padding:8px; width:65%; }
button { padding:10px 18px; margin:5px; cursor:pointer; }
pre { white-space:pre-wrap; overflow-wrap:anywhere; font:13px monospace; }
</style>
<h1>Keepick · 소켓과 방 입장 점검</h1>
<p>로컬 전용 테스트 클라이언트입니다. 카메라·마이크·AI는 사용하지 않습니다.</p>
<section>
<label>서버 <input id="server" value="http://127.0.0.1:18443"></label>
<label>방 <input id="room" value="step1-browser"></label>
<label>이름 <input id="name" value="Client A"></label>
<button id="connect">연결</button><button id="join">입장</button>
<button id="inspect">방 확인</button><button id="leave">퇴장</button><button id="disconnect">연결 종료</button>
<p id="status" role="status">연결 전</p>
<p id="members">참가자: 0</p>
<ul id="peers"></ul>
</section>
<section><h2>수신 이벤트</h2><pre id="events"></pre></section>
<script src="http://127.0.0.1:18443/socket.io/socket.io.js"></script>
<script>
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
$("name").value = params.get("name") || "Client A";
$("room").value = params.get("room") || "step1-browser";
let socket;
const peers = new Map();
function showPeers() {
  $("members").textContent = "참가자: " + peers.size;
  $("peers").replaceChildren(...Array.from(peers, ([id,name]) => {
    const li = document.createElement("li"); li.textContent = name + " · " + id; return li;
  }));
}
function log(event, data) {
  $("events").textContent += event + " " + JSON.stringify(data ?? "") + "\n";
}
$("connect").onclick = () => {
  if (socket?.connected) return;
  socket?.disconnect();
  socket = io($("server").value, { transports:["websocket"], reconnection:false });
  socket.on("connect", () => { $("status").textContent = "연결됨 · " + socket.id; log("connect",socket.id); });
  socket.on("connect_error", e => { $("status").textContent = "연결 실패"; log("connect_error",e.message); });
  socket.on("joined_room", data => {
    peers.clear(); peers.set(socket.id,$("name").value);
    for(const peer of data.peers) peers.set(peer.id,peer.name);
    $("status").textContent = "입장 완료 · " + $("room").value;
    showPeers(); log("joined_room", { peers:data.peers, chatSessionId:data.chatSessionId });
  });
  socket.on("user_joined", peer => { peers.set(peer.id,peer.name); showPeers(); log("user_joined",peer); });
  socket.on("user_left", peer => { peers.delete(peer.id); showPeers(); log("user_left",peer); });
  socket.on("room_info", data => { log("room_info",data); });
  socket.on("left_room", () => { peers.clear(); showPeers(); $("status").textContent = "퇴장 완료"; log("left_room"); });
  socket.on("disconnect", reason => { peers.clear(); showPeers(); $("status").textContent = "연결 종료"; log("disconnect",reason); });
  socket.on("error", data => log("error",data));
};
$("join").onclick = () => socket?.connected && socket.emit("join_room",{roomId:$("room").value,userName:$("name").value});
$("inspect").onclick = () => socket?.connected && socket.emit("get_room_info",{roomId:$("room").value});
$("leave").onclick = () => socket?.connected && socket.emit("leave_room");
$("disconnect").onclick = () => socket?.disconnect();
</script>
</html>
