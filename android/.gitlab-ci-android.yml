image: fabernovel/android:api-33-v1.7.0

cache:
  key: ${CI_PROJECT_ID}
  paths:
    - .gradle/wrapper
    - .gradle/caches

before_script:
  - export GRADLE_USER_HOME="$CI_PROJECT_DIR/.gradle"
  - chmod +x ./gradlew
  - echo "BASE_URL=$BASE_URL" >> local.properties

ktlint-check:
  stage: android-lint
  script:
    - ./gradlew ktlintCheck
  artifacts:
    reports:
      junit: app/build/reports/ktlint/**/ktlint*.xml
    paths:
      - app/build/reports/ktlint/
    expire_in: 1 week
    when: always
  only:
    - merge_requests
    - master
    - android

android-build:
  stage: android-build
  script:
    - ./gradlew clean assembleDebug
  artifacts:
    paths:
      - app/build/outputs/
    expire_in: 1 week
  only:
    - merge_requests
    - master
    - android

android-test:
  stage: android-test
  script:
    - ./gradlew testDebugUnitTest
  artifacts:
    reports:
      junit:
        - "**/test-results/**/TEST-*.xml"
        - "**/androidTest-results/**/TEST-*.xml"
    paths:
      - app/build/reports/tests/
    expire_in: 1 week
    when: always
  coverage: "/Total.*?([0-9]{1,3})%/"
  only:
    - merge_requests
    - master
    - android
