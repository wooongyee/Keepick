image: fabernovel/android:api-35-gcloud-ndk-v1.9.0

cache:
  # 1. 의존성 파일들의 내용으로 고유한 키를 만듭니다.
  #    이 파일들 중 하나라도 변경되면, 새로운 캐시가 생성됩니다.
  key:
    files:
      - android/build.gradle.kts
      - android/app/build.gradle.kts
      - android/gradle/libs.versions.toml
  paths:
    - android/.gradle/wrapper
    - android/.gradle/caches
  policy: pull-push

before_script:
  - cd android
  - export GRADLE_USER_HOME="$CI_PROJECT_DIR/android/.gradle"
  - chmod +x ./gradlew
  - echo "BASE_URL=$BASE_URL" >> local.properties

ktlint-check:
  stage: android-lint
  script:
    - ./gradlew ktlintCheck
  artifacts:
    reports:
      junit: app/build/reports/ktlint/**/ktlint*.xml
    paths:
      - app/build/reports/ktlint/
    expire_in: 1 week
    when: always
  only:
    - merge_requests
    - master
    - android

android-build:
  stage: android-build
  script:
    - ./gradlew clean assembleDebug
  artifacts:
    paths:
      - app/build/outputs/
    expire_in: 1 week
  only:
    - merge_requests
    - master
    - android

android-test:
  stage: android-test
  script:
    - ./gradlew testDebugUnitTest
  artifacts:
    reports:
      junit:
        - "**/test-results/**/TEST-*.xml"
        - "**/androidTest-results/**/TEST-*.xml"
    paths:
      - app/build/reports/tests/
    expire_in: 1 week
    when: always
  coverage: "/Total.*?([0-9]{1,3})%/"
  only:
    - merge_requests
    - master
    - android
