image: fabernovel/android:api-35-gcloud-ndk-v1.9.0

cache:
  key: ${CACHE_FINGERPRINT}
  paths:
    - android/.gradle/wrapper
    - android/.gradle/caches
  policy: pull-push

before_script:
  - cd android
  - # 1. 모든 의존성 관련 파일을 찾아서 하나의 임시 파일로 합칩니다.
  - find android -name "build.gradle.kts" -o -name "libs.versions.toml" | sort | xargs cat > all-dependencies.tmp
  - # 2. 합쳐진 파일의 내용으로 SHA256 해시값을 계산하고, 그 값을 변수에 저장합니다.
  - export CACHE_FINGERPRINT=$(sha256sum all-dependencies.tmp | cut -d' ' -f1)
  - # 3. 임시 파일을 삭제합니다.
  - rm all-dependencies.tmp
  - export GRADLE_USER_HOME="$CI_PROJECT_DIR/android/.gradle"
  - chmod +x ./gradlew
  - echo "BASE_URL=$BASE_URL" >> local.properties

ktlint-check:
  stage: android-lint
  script:
    - ./gradlew ktlintCheck
  artifacts:
    reports:
      junit: app/build/reports/ktlint/**/ktlint*.xml
    paths:
      - app/build/reports/ktlint/
    expire_in: 1 week
    when: always
  only:
    - merge_requests
    - master
    - android

android-build:
  stage: android-build
  script:
    - ./gradlew clean assembleDebug
  artifacts:
    paths:
      - app/build/outputs/
    expire_in: 1 week
  only:
    - merge_requests
    - master
    - android

android-test:
  stage: android-test
  script:
    - ./gradlew testDebugUnitTest
  artifacts:
    reports:
      junit:
        - "**/test-results/**/TEST-*.xml"
        - "**/androidTest-results/**/TEST-*.xml"
    paths:
      - app/build/reports/tests/
    expire_in: 1 week
    when: always
  coverage: "/Total.*?([0-9]{1,3})%/"
  only:
    - merge_requests
    - master
    - android
