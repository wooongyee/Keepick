name: keepick-homeserver
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: keepick
      MYSQL_USER: keepick
      MYSQL_PASSWORD: ${DB_PASSWORD:?required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?required}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./exec/sql/ddl.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    volumes: ["redis-data:/data"]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    image: ${IMAGE_API:-keepick-api:local}
    build: {context: ., dockerfile: deploy/Dockerfile.api}
    container_name: keepick-api
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local,homeserver
      DB_PASSWORD: ${DB_PASSWORD:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      STATE_SECRET: ${STATE_SECRET:?required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?required}
      GOOGLE_REDIRECT_URI: ${PUBLIC_ORIGIN:?required}/api/login/oauth2/code/google
      LOCAL_WEB_URL: ${PUBLIC_ORIGIN}
      LOCAL_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN}
      LOCAL_API_URL: ${PUBLIC_ORIGIN}
      LOCAL_STORAGE_ROOT: /app/images
      LOCAL_STORAGE_SECRET: ${LOCAL_STORAGE_SECRET:?required}
    volumes: ["images:/app/images"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    mem_limit: 1024m
  realtime:
    image: ${IMAGE_REALTIME:-keepick-realtime:local}
    build: {context: ., dockerfile: deploy/Dockerfile.realtime}
    container_name: keepick-realtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      REALTIME_REQUIRE_AUTH: "true"
      API_INTERNAL_URL: http://api:8080
      SOCKET_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN}
      MEDIASOUP_LISTEN_IP: 0.0.0.0
      MEDIASOUP_ANNOUNCED_IP: ${MEDIA_PUBLIC_IP:?required}
      MEDIASOUP_ADDITIONAL_ANNOUNCED_IPS: ${MEDIA_LAN_IP:-}
      MEDIASOUP_MIN_PORT: 40000
      MEDIASOUP_MAX_PORT: 40099
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8443/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
  web:
    image: ${IMAGE_WEB:-keepick-web:local}
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args: {PUBLIC_ORIGIN: "${PUBLIC_ORIGIN}"}
    container_name: keepick-web
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
  gateway:
    image: ${IMAGE_GATEWAY:-keepick-gateway:local}
    build: {context: ., dockerfile: deploy/Dockerfile.gateway}
    container_name: keepick-gateway
    restart: unless-stopped
    depends_on:
      api: {condition: service_started}
      web: {condition: service_healthy}
      realtime: {condition: service_healthy}
    networks: [default, gateway]
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ && wget -q -O /dev/null http://127.0.0.1/api/local-health && wget -q -O /dev/null http://127.0.0.1/realtime-health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
volumes:
  mysql-data: {name: keepick-mysql-data}
  redis-data: {name: keepick-redis-data}
  images: {name: keepick-images}
networks:
  gateway:
    external: true
    name: seedops_default
